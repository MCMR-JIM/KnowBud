<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoopTutor · 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="app-shell">
    <!-- ======== 左侧导航 ======== -->
    <aside class="brand-panel">
      <div class="brand-head">
        <div class="brand-logo">LT</div>
        <div class="brand-name">LoopTutor</div>
        <div class="brand-sub">家长控制台 · 设置</div>
      </div>
      <nav class="step-nav">
        <button class="step active" data-step="0">
          <span class="step-num">01</span>
          <span class="step-label">LLM 设置</span>
        </button>
        <button class="step" data-step="1">
          <span class="step-num">02</span>
          <span class="step-label">模型下载</span>
        </button>
        <button class="step" data-step="2">
          <span class="step-num">03</span>
          <span class="step-label">下载进度</span>
        </button>
      </nav>
      <div class="brand-footer">
        <a href="/admin" class="back-link">&larr; 返回控制台</a>
      </div>
    </aside>

    <!-- ======== 右侧内容 ======== -->
    <main class="content">
      <!-- Pane 0: LLM 设置 -->
      <section class="pane active" data-step="0">
        <header class="pane-header">
          <h1>LLM 设置</h1>
          <p>配置模型服务连接参数，支持远程 API 和本地部署两种模式。</p>
        </header>

        <div class="mode-switch">
          <label class="radio-card">
            <input type="radio" name="llm-mode" value="remote" checked>
            <span class="radio-body">
              <span class="radio-title">远程 API</span>
              <span class="radio-desc">通过 API Key 连接 OpenAI 兼容服务</span>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="llm-mode" value="local">
            <span class="radio-body">
              <span class="radio-title">本地模型</span>
              <span class="radio-desc">在本地 GPU 上运行开源 LLM</span>
            </span>
          </label>
        </div>

        <!-- 远程 API 面板 -->
        <div id="panel-remote" class="settings-group">
          <div class="field">
            <label class="field-label">API Key</label>
            <div class="input-wrap">
              <input type="password" id="api-key" class="input" placeholder="sk-..." autocomplete="off">
              <button type="button" id="toggle-api-key" class="input-btn" title="显示/隐藏">&#128065;</button>
            </div>
          </div>
          <div class="field">
            <label class="field-label">Base URL</label>
            <input type="text" id="base-url" class="input" placeholder="https://api.openai.com/v1">
          </div>
          <div class="field">
            <label class="field-label">Model</label>
            <select id="remote-model" class="input select">
              <option value="">自动检测</option>
              <option value="gpt-4o">gpt-4o</option>
              <option value="gpt-4o-mini">gpt-4o-mini</option>
              <option value="gpt-4-turbo">gpt-4-turbo</option>
              <option value="deepseek-chat">deepseek-chat</option>
              <option value="qwen-plus">qwen-plus</option>
            </select>
          </div>
          <button id="test-connection" class="btn btn-accent">测试连接</button>
          <span id="connection-status" class="status-text"></span>
        </div>

        <!-- 本地模型面板 -->
        <div id="panel-local" class="settings-group hidden">
          <div class="field">
            <label class="field-label">GPU 检测结果</label>
            <div id="gpu-info" class="info-card">
              <div class="info-row"><span class="info-key">设备</span><span class="info-val" id="gpu-name">检测中...</span></div>
              <div class="info-row"><span class="info-key">总显存</span><span class="info-val" id="gpu-total">--</span></div>
              <div class="info-row"><span class="info-key">可用显存</span><span class="info-val" id="gpu-free">--</span></div>
            </div>
          </div>
          <div class="field">
            <label class="field-label">模型路径</label>
            <input type="text" id="model-path" class="input" placeholder="输入本地模型目录路径">
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label">精度</label>
              <select id="precision" class="input select">
                <option value="bf16">bf16</option>
                <option value="fp16">fp16</option>
                <option value="int8">int8</option>
                <option value="int4">int4</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label">温度</label>
              <input type="number" id="temperature" class="input" value="0.1" min="0" max="2" step="0.05">
            </div>
            <div class="field">
              <label class="field-label">超时(秒)</label>
              <input type="number" id="timeout-sec" class="input" value="15" min="5" max="120">
            </div>
            <div class="field">
              <label class="field-label">最大 Token</label>
              <input type="number" id="max-tokens" class="input" value="2048" min="256" max="32768">
            </div>
          </div>
        </div>

        <button id="save-settings" class="btn btn-primary">保存设置</button>
      </section>

      <!-- Pane 1: 模型下载 -->
      <section class="pane" data-step="1">
        <header class="pane-header">
          <h1>模型下载</h1>
          <p>选择需要部署到本地的开源模型，点击下载后将自动从 HuggingFace 拉取。</p>
        </header>
        <div id="model-cards" class="model-grid">
          <!-- JS 动态生成 -->
        </div>
      </section>

      <!-- Pane 2: 下载进度 -->
      <section class="pane" data-step="2">
        <header class="pane-header">
          <h1>下载进度</h1>
          <p>实时监控当前下载任务的状态，支持暂停、取消和删除操作。</p>
        </header>
        <div id="progress-wrap" class="progress-wrap">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-label" id="progress-label">0%</div>
          <div class="log-box" id="log-box">
            <div class="log-entry">等待下载任务...</div>
          </div>
        </div>
      </section>

      <!-- 状态通知 -->
      <div id="toast" class="toast hidden"></div>
    </main>
  </div>
  <script src="settings.js"></script>
</body>
</html>
